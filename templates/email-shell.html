<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; padding:0; background:#f4f5f7; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 16px; }
  .card { background:#ffffff; border:1px solid #e3e6ea; border-radius:8px;
          padding:32px 36px; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
          color:#232a31; font-size:15px; line-height:1.55; }
  .card h1 { font-size:21px; color:#1c2430; margin:0 0 4px 0; }
  .card h1 + p { color:#6b7684; font-size:13px; margin-top:0; }
  .card h2 { font-size:17px; color:#1c2430; border-bottom:2px solid #e8562d;
             padding-bottom:6px; margin-top:30px; }
  .card h3 { font-size:14px; color:#44505c; text-transform:uppercase;
             letter-spacing:.04em; margin-bottom:6px; }
  .card ul { padding-left:20px; margin-top:6px; }
  .card li { margin:3px 0; }
  .card a { color:#1668ad; text-decoration:none; }
  .card hr { border:none; border-top:1px solid #e3e6ea; margin:26px 0; }
  .card strong { color:#1c2430; }
  .card table { border-collapse:collapse; width:100%; margin:10px 0 6px 0; font-size:13px; }
  .card th { text-align:left; color:#44505c; font-weight:600; padding:6px 10px;
             border-bottom:2px solid #d7dce1; white-space:nowrap; }
  .card td { padding:6px 10px; border-bottom:1px solid #edf0f2; vertical-align:top; }
  .card tr:nth-child(even) td { background:#fafbfc; }
  .card col { width:auto !important; }
  .card table { table-layout:auto; }
  .foot { text-align:center; color:#9aa3ad; font-size:12px; padding:14px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
REPORT_BODY_GOES_HERE
    </div>
    <div class="foot">Daily Security Report &middot; generated automatically by InsightConnect</div>
  </div>
</body>
</html>
